name: EasyP

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: EasyP Lint
        uses: easyp-tech/actions/lint@v1.1.1
        with:
          version: v0.16.0
          config: easyp.yaml
          directory: api

  breaking:
    name: Breaking Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: EasyP Breaking
        uses: easyp-tech/actions/breaking@v1.1.1
        with:
          version: v0.16.0
          config: easyp.yaml
          directory: api
          against: master
