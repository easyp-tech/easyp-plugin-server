name: "Release"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod: the pinned 1.24 had drifted from the
          # module's 1.26 and only worked via toolchain auto-download.
          go-version-file: go.mod

      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag ${GITHUB_REF_NAME} is not a valid release version"
            exit 1
          fi
          echo "✅ Valid release tag: ${GITHUB_REF_NAME}"

      - name: Create release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --timeout=90m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After publication rather than before: goreleaser builds and pushes in one
      # step, so there is no local image to scan first. A finding here means
      # pulling the tag, not that customers were spared it — treat a failure as
      # a reason to cut a patch release, not as noise.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/easyp-tech/service:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
