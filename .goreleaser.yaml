version: 2

project_name: easyp-api-service

builds:
  - skip: true

snapshot:
  version_template: SNAPSHOT-{{ .Commit }}

changelog:
  sort: asc
  filters:
    exclude:
      - '(?i)^docs?:'
      - '(?i)^docs\([^:]+\):'
      - '(?i)^docs\[[^:]+\]:'
      - '^tests?:'
      - '(?i)^dev:'
      - '(?i)^chore:'
      - Merge pull request
      - Merge branch

release:
  skip_upload: false
  github:
    owner: easyp-tech
    name: service
  header: |
    `easyp-api-service` is a free and open-source project built by volunteers.

dockers:
  - image_templates:
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/easyp-tech/service"
      - "--label=org.opencontainers.image.licenses=Elastic-2.0"
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
      - api
      - registry
      # The Dockerfile compiles from source, so every package cmd/easyp-svc
      # imports has to be in the build context. sdk is one of them.
      - sdk
      # Needed by the COPY in Dockerfile: ELv2 requires the terms to travel
      # with the software.
      - LICENSE

  - image_templates:
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/easyp-tech/service"
      - "--label=org.opencontainers.image.licenses=Elastic-2.0"
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
      - api
      - registry
      # The Dockerfile compiles from source, so every package cmd/easyp-svc
      # imports has to be in the build context. sdk is one of them.
      - sdk
      # Needed by the COPY in Dockerfile: ELv2 requires the terms to travel
      # with the software.
      - LICENSE

docker_manifests:
  - name_template: "ghcr.io/easyp-tech/service:{{ .Tag }}"
    image_templates:
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-amd64"
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-arm64"

  - name_template: "ghcr.io/easyp-tech/service:latest"
    image_templates:
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-amd64"
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-arm64"
