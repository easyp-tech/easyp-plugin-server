version: "3"

vars:
  # Everything deployment-shaped lives under deploy/. Compose resolves the
  # relative paths inside these files against the directory holding them, so
  # -f is all that is needed — the volume paths stay readable from deploy/.
  COMPOSE: "docker compose -f deploy/docker-compose.yml"
  COMPOSE_DEV: "docker compose -f deploy/docker-compose.dev.yml"

tasks:
  certs:
    desc: "Generate the development CA and the server/client/edge certificates in deploy/certs/"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "./deploy/scripts/gen-dev-certs.sh"

  up:
    desc: "Start all services. For Enterprise: LICENSE_PUBLIC_KEYS=<kid>:<hex> LICENSE_KEY=... task up"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f deploy/docker-compose.yml"
    cmds:
      # The stack speaks mTLS; without certificates the service refuses to start.
      - task: certs
      - "{{.COMPOSE}} up --build --remove-orphans --detach"

  up-minimal:
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f deploy/docker-compose.yml"
    cmds:
      - "sh -c 'EASYP_POSTGRES_PORT=${EASYP_POSTGRES_PORT:-5433} {{.COMPOSE}} up -d postgres'"

  down:
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f deploy/docker-compose.yml"
    cmds:
      - "{{.COMPOSE}} down --volumes"

  up-dev:
    desc: "Start community and enterprise side by side (8080-8083 / 9080-9083)"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f deploy/docker-compose.dev.yml"
      # Without a licence the enterprise container starts, reports community and
      # serves happily — which makes the stack look fine while testing nothing
      # the stack exists to test. Refuse instead.
      - sh: "test -f deploy/.env.dev"
        msg: "deploy/.env.dev not found. Copy deploy/.env.dev.example to deploy/.env.dev — it carries the development licence."
    cmds:
      # Both tiers sit behind traefik, which speaks mTLS to them.
      - task: certs
      - "{{.COMPOSE_DEV}} --env-file deploy/.env.dev up --remove-orphans --detach"
      - |
        echo
        echo "  community   localhost:8080-8083   community.easyp.localhost   easyp_community_db"
        echo "  enterprise  localhost:9080-9083   enterprise.easyp.localhost  easyp_enterprise_db"
        echo
        echo "Confirm the tiers actually differ before trusting the stack:"
        echo "  task tier-dev"

  down-dev:
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f deploy/docker-compose.dev.yml"
    cmds:
      - "{{.COMPOSE_DEV}} down --volumes"

  logs-dev:
    desc: "Follow both dev tiers"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "{{.COMPOSE_DEV}} logs --follow service-community service-enterprise"

  tier-dev:
    desc: "Check that the dev stack's two tiers are actually different tiers"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      # The check itself lives in deploy/scripts/ because the deployment
      # directory is copied to hosts that carry neither this file nor task.
      - "./deploy/scripts/check-tiers.sh"

  build-plugins:
    desc: "Build all plugin binaries from registry/ Dockerfiles"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go run ./cmd/easyp-svc/ plugins build registry --parallel 12 --output plugins "

  build-plugins-filter:
    desc: "Build a subset of plugins, e.g. FILTER='protocolbuffers/*' task build-plugins-filter"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go run ./cmd/easyp-svc/ plugins build registry --output plugins --filter '{{.FILTER}}'"

  push-plugins:
    desc: "Pack and upload built plugin archives to S3 storage (rustfs in the dev stack)"
    dir: "{{.USER_WORKING_DIR}}"
    env:
      # Credentials reach the AWS SDK default chain; the service reads its own
      # from registry.s3 in config.yml.
      AWS_ACCESS_KEY_ID: "rustfsadmin"
      AWS_SECRET_ACCESS_KEY: "rustfsadmin"
    cmds:
      # The compose config points at rustfs:9000, which is unreachable from the
      # host — pass the published endpoint explicitly.
      - >-
        go run ./cmd/easyp-svc/ plugins push
        --endpoint http://localhost:9000
        --bucket easyp-plugins
        --region us-east-1
        --force-path-style
        --non-interactive

  push-archives:
    desc: >-
      Upload a packed archive tree (from `plugins pack`) to any S3-compatible storage, e.g.
      S3_ENDPOINT=https://storage.example.com AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... task push-archives
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      ARCHIVES: '{{.ARCHIVES | default "../plugin-archives"}}'
      S3_BUCKET: '{{.S3_BUCKET | default "easyp-plugins"}}'
      # Storage tends to cap one connection well below the uplink, so the
      # default here is high enough to saturate an ordinary link.
      PARALLEL: '{{.PARALLEL | default "24"}}'
    preconditions:
      - sh: 'test -n "$S3_ENDPOINT"'
        msg: "S3_ENDPOINT is required, e.g. S3_ENDPOINT=https://storage.example.com task push-archives"
      - sh: 'test -d "{{.ARCHIVES}}"'
        msg: "{{.ARCHIVES}} not found; pack first or pass ARCHIVES=<dir>"
    cmds:
      # Credentials are left to the AWS SDK default chain: they belong in the
      # environment or a secret manager, never in this file.
      - >-
        go run ./cmd/easyp-svc/ plugins push {{.ARCHIVES}} --packed
        --endpoint "$S3_ENDPOINT"
        --bucket {{.S3_BUCKET}}
        --force-path-style
        --parallel {{.PARALLEL}}

  register-plugins:
    desc: "Register all built plugins via gRPC CreatePlugin API"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f deploy/certs/ca.crt"
    cmds:
      # The gRPC port is not published: the only way in is through traefik,
      # which terminates the edge certificate and re-establishes mTLS inward.
      # CreatePlugin is a mutating method: it needs a token whose digest is
      # listed in auth.write_tokens. The default matches the throwaway token
      # shipped in config.yml; set EASYP_TOKEN to override it.
      - >-
        go run ./cmd/easyp-svc/ plugins register
        --addr easyp.api.localhost:${EASYP_TRAEFIK_TLS_PORT:-4443}
        --tls-ca deploy/certs/ca.crt
        --token ${EASYP_TOKEN:-local-dev-token}
        --cfg deploy/config/config.yml
        --non-interactive


  run:
    desc: "Full cycle: build plugins → restart services → register → follow logs"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: build-plugins
      - task: down
      - task: up
      - "echo 'Waiting for service to be ready...' && until curl -sf http://localhost:8082/health >/dev/null 2>&1; do sleep 2; done && echo 'Service is ready!'"
      - task: push-plugins
      - task: register-plugins

  setup:
    desc: "Build plugins, start services, register plugins (no logs)"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: build-plugins
      - task: down
      - task: up
      - "echo 'Waiting for service to be ready...' && until curl -sf http://localhost:8082/health >/dev/null 2>&1; do sleep 2; done && echo 'Service is ready!'"
      - task: push-plugins
      - task: register-plugins

  run-local:
    desc: "Start local service and automatically migrate plugins"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f deploy/config/config.local.yml"
    cmds:
      - |
        (
          echo "Waiting for local service to be ready..."
          until curl -sf http://localhost:8082/health >/dev/null 2>&1; do
            sleep 1
          done
          echo "Service is ready! Running plugin migration..."
          # config.local.yml leaves server.tls empty, so this leg is plaintext,
          # and it ships the matching throwaway write token.
          go run ./cmd/easyp-svc/ plugins register --addr localhost:8080 --cfg deploy/config/config.local.yml \
            --non-interactive --insecure --token local-dev-token
        ) &
        go run ./cmd/easyp-svc/ service start --cfg deploy/config/config.local.yml --log_level debug

  run-local-test:
    desc: "Start local service with mock plugins for testing migration CLI"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f deploy/config/config.local.yml"
    cmds:
      - "mkdir -p plugins/grpc/go/v1.5.1 && touch plugins/grpc/go/v1.5.1/plugin"
      - "mkdir -p plugins/grpc-ecosystem/gateway/v2.27.3 && touch plugins/grpc-ecosystem/gateway/v2.27.3/plugin"
      - "mkdir -p plugins/protocolbuffers/go/v1.36.10 && touch plugins/protocolbuffers/go/v1.36.10/plugin"
      - defer: "rm -rf plugins/grpc plugins/grpc-ecosystem plugins/protocolbuffers"
      - task: run-local


  test-mcp:
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go test ./internal/mcpserver -run TestMCPServer -count=1"

  smoke-mcp:
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - "up"
    cmds:
      - "go run ./cmd/mcp-smoke --endpoint http://localhost:8083/mcp"

  generate:
    desc: "Run easyp generate against locally running service (localhost:8080)"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f easyp.yaml"
    cmds:
      - "easyp --cfg easyp.yaml generate"

  generate-local:
    desc: "Run easyp generate against local service (localhost:8080)"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f easyp.local.yaml"
    cmds:
      - "easyp --cfg easyp.local.yaml generate"
