version: "3"

tasks:
  up:
    desc: "Start all services. For Enterprise: LICENSE_PUBLIC_KEY=... LICENSE_KEY=... task up"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f docker-compose.yml"
    cmds:
      - "docker compose up --build --remove-orphans --detach"

  up-minimal:
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f docker-compose.yml"
    cmds:
      - "sh -c 'EASYP_POSTGRES_PORT=${EASYP_POSTGRES_PORT:-5433} docker compose up -d postgres'"

  down:
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f docker-compose.yml"
    cmds:
      - "docker compose down --volumes"

  build-plugins:
    desc: "Build all plugin binaries from registry/ Dockerfiles"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go run ./cmd/easyp-svc/ plugins build registry --parallel 12 --output plugins "

  build-plugins-filter:
    desc: "Build a subset of plugins, e.g. FILTER='protocolbuffers/*' task build-plugins-filter"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go run ./cmd/easyp-svc/ plugins build registry --output plugins --filter '{{.FILTER}}'"

  register-plugins:
    desc: "Register all built plugins via gRPC CreatePlugin API"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go run ./cmd/easyp-svc/ plugins migrate plugins/ --addr localhost:8080 --cfg config.yml"


  run:
    desc: "Full cycle: build plugins → restart services → register → follow logs"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: build-plugins
      - task: down
      - task: up
      - "echo 'Waiting for service to be ready...' && until curl -sf http://localhost:8082/health >/dev/null 2>&1; do sleep 2; done && echo 'Service is ready!'"
      - task: register-plugins

  setup:
    desc: "Build plugins, start services, register plugins (no logs)"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: build-plugins
      - task: down
      - task: up
      - "echo 'Waiting for service to be ready...' && until curl -sf http://localhost:8082/health >/dev/null 2>&1; do sleep 2; done && echo 'Service is ready!'"
      - task: register-plugins

  run-local:
    desc: "Start local service and automatically migrate plugins"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f config.local.yml"
    cmds:
      - |
        (
          echo "Waiting for local service to be ready..."
          until curl -sf http://localhost:8082/health >/dev/null 2>&1; do
            sleep 1
          done
          echo "Service is ready! Running plugin migration..."
          go run ./cmd/easyp-svc/ plugins migrate plugins/ --addr localhost:8080 --cfg config.local.yml
        ) &
        go run ./cmd/easyp-svc/ service start --cfg config.local.yml --log_level debug

  run-local-test:
    desc: "Start local service with mock plugins for testing migration CLI"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f config.local.yml"
    cmds:
      - "mkdir -p plugins/grpc/go/v1.5.1 && touch plugins/grpc/go/v1.5.1/plugin"
      - "mkdir -p plugins/grpc-ecosystem/gateway/v2.27.3 && touch plugins/grpc-ecosystem/gateway/v2.27.3/plugin"
      - "mkdir -p plugins/protocolbuffers/go/v1.36.10 && touch plugins/protocolbuffers/go/v1.36.10/plugin"
      - defer: "rm -rf plugins/grpc plugins/grpc-ecosystem plugins/protocolbuffers"
      - task: run-local


  test-mcp:
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go test ./internal/mcpserver -run TestMCPServer -count=1"

  smoke-mcp:
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - "up"
    cmds:
      - "go run ./cmd/mcp-smoke --endpoint http://localhost:8083/mcp"

  generate:
    desc: "Run easyp generate against locally running service (localhost:8080)"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f easyp.yaml"
    cmds:
      - "easyp --cfg easyp.yaml generate"

  generate-local:
    desc: "Run easyp generate against local service (localhost:8080)"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f easyp.local.yaml"
    cmds:
      - "easyp --cfg easyp.local.yaml generate"
