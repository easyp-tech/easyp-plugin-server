syntax = "proto3";

package api.generator.v1;

import "mcp/options/v1/options.proto";
import "doc/v1/doc.proto";
import "google/protobuf/compiler/plugin.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/easyp-tech/service/api/generator/v1;generator";

// EasyP Code Generation Service
//
// This service provides a centralized API for executing protobuf/gRPC code generation plugins.
// Plugins run as isolated Docker containers, ensuring version consistency across development teams.
//
// ## Benefits
//
// - **Version Control**: All developers use the same plugin versions
// - **Zero Setup**: No local plugin installation required
// - **Security**: Plugins run in sandboxed containers with resource limits
// - **Auditability**: Centralized logging of all generation requests
//
// ## Quick Start
//
// 1. Call `Plugins` to list available plugins
// 2. Build a `CodeGeneratorRequest` with your proto files
// 3. Call `GenerateCode` with the plugin name and request
// 4. Process the `CodeGeneratorResponse` with generated files
//
// ## Plugin Naming Convention
//
// Plugins are identified using the format: `<group>/<name>:<version>`
//
// Examples:
// - `protocolbuffers/go:v1.36.10` — Official Go protobuf plugin
// - `grpc/go:v1.5.1` — Official gRPC Go plugin
// - `grpc-ecosystem/gateway:v2.27.3` — gRPC-Gateway plugin
//
// Use `latest` as version to get the most recent version:
// - `protocolbuffers/go:latest`
service ServiceAPI {
  // Generate code using a specified plugin.
  //
  // This method executes a protobuf code generation plugin and returns the generated files.
  // The plugin runs in an isolated Docker container with the following default limits:
  //
  // - **Network**: Disabled (no external access)
  // - **Memory**: 128MB
  // - **CPU**: 1.0 core
  //
  // ## Error Codes
  //
  // | Code | Description |
  // |------|-------------|
  // | `NOT_FOUND` | Plugin not found in registry |
  // | `INVALID_ARGUMENT` | Invalid plugin name format |
  // | `INTERNAL` | Plugin execution failed |
  // | `DEADLINE_EXCEEDED` | Plugin execution timeout |
  rpc GenerateCode(GenerateCodeRequest) returns (GenerateCodeResponse) {
    option (mcp.options.v1.method) = {
      hidden: true
    };
  }

  // List available plugins.
  //
  // Returns a list of all plugins registered in the service.
  // Use this to discover available plugins and their versions.
  rpc Plugins(PluginsRequest) returns (PluginsResponse) {
    option (mcp.options.v1.method) = {
      name: "plugins_list"
      title: "List plugins"
      description: "List available plugins with optional filters: group, name, version, tags."
    };
  }

  // Create a new plugin registration.
  //
  // Registers a plugin with the given group, name, version, optional config, and tags.
  // Requires an Enterprise license.
  //
  // ## Error Codes
  //
  // | Code | Description |
  // |------|-------------|
  // | `ALREADY_EXISTS` | Plugin with same group/name/version exists |
  // | `INVALID_ARGUMENT` | Invalid plugin name format |
  // | `RESOURCE_EXHAUSTED` | Max plugins limit reached |
  // | `PERMISSION_DENIED` | Enterprise license required |
  rpc CreatePlugin(CreatePluginRequest) returns (CreatePluginResponse) {
    option (mcp.options.v1.method) = {
      hidden: true
    };
  }

  // Update an existing plugin.
  //
  // Replaces the config and tags of an existing plugin identified by group/name/version.
  // Requires an Enterprise license.
  //
  // ## Error Codes
  //
  // | Code | Description |
  // |------|-------------|
  // | `NOT_FOUND` | Plugin not found |
  // | `INVALID_ARGUMENT` | Invalid plugin name format |
  // | `PERMISSION_DENIED` | Enterprise license required |
  rpc UpdatePlugin(UpdatePluginRequest) returns (UpdatePluginResponse) {
    option (mcp.options.v1.method) = {
      hidden: true
    };
  }

  // Delete a plugin.
  //
  // Removes a plugin from the registry by group/name/version.
  // Requires an Enterprise license.
  //
  // ## Error Codes
  //
  // | Code | Description |
  // |------|-------------|
  // | `NOT_FOUND` | Plugin not found |
  // | `PERMISSION_DENIED` | Enterprise license required |
  rpc DeletePlugin(DeletePluginRequest) returns (DeletePluginResponse) {
    option (mcp.options.v1.method) = {
      hidden: true
    };
  }
}

// Request message for code generation.
message GenerateCodeRequest {
  // Standard protobuf code generator request.
  //
  // This should contain the proto files to process and any plugin-specific parameters.
  // The request is passed directly to the plugin's stdin.
  google.protobuf.compiler.CodeGeneratorRequest code_generator_request = 1 [(doc.v1.field) = {
    required: true
  }];

  // Name of the plugin to use for generation.
  //
  // Format: `<group>/<name>:<version>`
  //
  // Examples:
  // - `protocolbuffers/go:v1.36.10`
  // - `grpc/go:v1.5.1`
  // - `grpc-ecosystem/gateway:latest`
  string plugin_name = 2 [(doc.v1.field) = {
    required: true
    pattern: "^[a-z][a-z0-9-]*/[a-z][a-z0-9-]*:(v[0-9]+\\.[0-9]+\\.[0-9]+|latest)$"
    example: "protocolbuffers/go:v1.36.10"
  }];
}

// Response message for code generation.
message GenerateCodeResponse {
  // Standard protobuf code generator response.
  //
  // Contains the generated files and any error messages from the plugin.
  // Check the `error` field in the response for plugin-level errors.
  google.protobuf.compiler.CodeGeneratorResponse code_generator_response = 1 [(doc.v1.field) = {
    output_only: true
  }];
}

// Request message for listing plugins.
message PluginsRequest {
  // Filter by exact plugin group.
  //
  // Omit to return plugins from all groups.
  optional string group = 1 [(doc.v1.field) = {
    pattern: "^[a-z][a-z0-9-]*$"
    example: "grpc"
  }];

  // Filter by exact plugin name.
  //
  // Omit to return plugins with any name.
  optional string name = 2 [(doc.v1.field) = {
    pattern: "^[a-z][a-z0-9-]*$"
    example: "go"
  }];

  // Filter by exact plugin version.
  //
  // Omit to return all versions.
  optional string version = 3 [(doc.v1.field) = {
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
    example: "v1.5.1"
  }];

  // Filter by tags.
  //
  // A plugin must contain all specified tags to match.
  repeated string tags = 4 [(doc.v1.field) = {
    example: "stable"
  }];

  // Maximum number of plugins to return in one response.
  //
  // Omitting it (or zero) selects the server's default page size (100).
  // Values above the server's ceiling (1000) are cut down to it rather than
  // rejected.
  optional uint32 page_size = 5 [(doc.v1.field) = {
    example: "100"
  }];

  // Continuation token from a previous response's next_page_token.
  //
  // Omit to read the first page. The token is opaque: it is only meaningful
  // to the server that issued it, and only together with the same filters —
  // changing the filters between pages makes the result undefined.
  optional string page_token = 6 [(doc.v1.field) = {
    example: ""
  }];
}

// Response message for listing plugins.
message PluginsResponse {
  // List of available plugins matching the supplied filters.
  //
  // Plugins are sorted by group, name, and version.
  repeated PluginInfo plugins = 1 [(doc.v1.field) = {
    output_only: true
  }];

  // Number of matching plugins in this response.
  int32 total = 2 [(doc.v1.field) = {
    output_only: true
  }];

  // Token for the next page, empty when this response is the last page.
  //
  // Pass it back in PluginsRequest.page_token, with the same filters, to
  // continue the listing.
  string next_page_token = 3 [(doc.v1.field) = {
    output_only: true
  }];
}

// Information about a registered plugin.
message PluginInfo {
  // Unique identifier for the plugin.
  //
  // This is an internal UUID assigned when the plugin is registered.
  string id = 1 [(doc.v1.field) = {
    output_only: true
    format: FORMAT_UUID
  }];

  // Group to which the plugin belongs.
  //
  // Groups organize plugins by maintainer or ecosystem.
  //
  // Common groups:
  // - `protocolbuffers` — Official Google protobuf plugins
  // - `grpc` — Official gRPC plugins
  // - `grpc-ecosystem` — gRPC ecosystem plugins (gateway, openapi)
  // - `community` — Community-maintained plugins
  string group = 2 [(doc.v1.field) = {
    output_only: true
    pattern: "^[a-z][a-z0-9-]*$"
    example: "protocolbuffers"
  }];

  // Name of the plugin.
  //
  // This is the plugin's identifier within its group.
  //
  // Examples: `go`, `python`, `gateway`, `openapiv2`
  string name = 3 [(doc.v1.field) = {
    output_only: true
    pattern: "^[a-z][a-z0-9-]*$"
    example: "go"
  }];

  // Version of the plugin.
  //
  // Follows semantic versioning (semver) format.
  string version = 4 [(doc.v1.field) = {
    output_only: true
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
    example: "v1.36.10"
  }];

  // Timestamp when the plugin was registered.
  google.protobuf.Timestamp created_at = 5 [
    json_name = "created_at",
    (doc.v1.field) = {
      output_only: true
    }
  ];

  // Tags associated with the plugin for categorization.
  //
  // Tags help organize and filter plugins by category.
  // Examples: `go`, `grpc`, `official`, `community`
  repeated string tags = 6 [(doc.v1.field) = {
    output_only: true
  }];
}

// Request message for creating a plugin.
message CreatePluginRequest {
  // Group to which the plugin belongs.
  string group = 1 [(doc.v1.field) = {
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    example: "grpc"
  }];

  // Name of the plugin.
  string name = 2 [(doc.v1.field) = {
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    example: "go"
  }];

  // Version of the plugin.
  string version = 3 [(doc.v1.field) = {
    required: true
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
    example: "v1.5.1"
  }];

  // Optional plugin configuration.
  google.protobuf.Struct config = 4;

  // Tags for the plugin.
  repeated string tags = 5;
}

// Response message for creating a plugin.
message CreatePluginResponse {
  // The created plugin information.
  PluginInfo plugin = 1 [(doc.v1.field) = {
    output_only: true
  }];
}

// Request message for updating a plugin.
message UpdatePluginRequest {
  // Group to which the plugin belongs.
  string group = 1 [(doc.v1.field) = {
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    example: "grpc"
  }];

  // Name of the plugin.
  string name = 2 [(doc.v1.field) = {
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    example: "go"
  }];

  // Version of the plugin.
  string version = 3 [(doc.v1.field) = {
    required: true
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
    example: "v1.5.1"
  }];

  // New plugin configuration (replaces existing).
  google.protobuf.Struct config = 4;

  // New tags (replaces existing).
  repeated string tags = 5;
}

// Response message for updating a plugin.
message UpdatePluginResponse {
  // The updated plugin information.
  PluginInfo plugin = 1 [(doc.v1.field) = {
    output_only: true
  }];
}

// Request message for deleting a plugin.
message DeletePluginRequest {
  // Group to which the plugin belongs.
  string group = 1 [(doc.v1.field) = {
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    example: "grpc"
  }];

  // Name of the plugin.
  string name = 2 [(doc.v1.field) = {
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    example: "go"
  }];

  // Version of the plugin.
  string version = 3 [(doc.v1.field) = {
    required: true
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
    example: "v1.5.1"
  }];
}

// Response message for deleting a plugin.
message DeletePluginResponse {}
