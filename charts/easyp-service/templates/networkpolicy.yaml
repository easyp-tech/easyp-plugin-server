{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "easyp-service.fullname" . }}
  labels:
    {{- include "easyp-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "easyp-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gRPC is reachable only from the ingress controller. Everything else in the
    # cluster gets no route to it, which is the point of the mutual-TLS leg.
    - from:
        {{- if .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        {{- end }}
      ports:
        - port: grpc
          protocol: TCP
    # Metrics and health are scraped and probed from anywhere in the cluster;
    # neither exposes data worth restricting, and kubelet probes come from the
    # node, which a namespace selector would not match.
    - ports:
        - port: metrics
          protocol: TCP
        - port: health
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
