{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "easyp-service.serviceAccountName" . }}
  labels:
    {{- include "easyp-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The service talks to Postgres, S3 and an OTLP collector; it never calls the
# Kubernetes API, so it has no need for a mounted token.
automountServiceAccountToken: false
{{- end }}
