server:
  host: "0.0.0.0"
  port:
    grpc: 8080
    metric: 8081
    health: 8082
    mcp: 8083
  # Hard exit this long after a termination signal. Must outlast
  # worker_pool.generation_timeout, otherwise a rolling deploy severs work the
  # service already accepted; startup refuses a shorter value.
  force_shutdown_after: 150s
  # Transport security for the gRPC listener. Leaving cert_file empty serves
  # plaintext, which the service logs a warning about on every start.
  # client_ca_file turns the listener into mutual TLS: only certificates signed
  # by that CA are accepted, which is how traefik is authenticated here.
  tls:
    cert_file: "/certs/server.crt"
    key_file: "/certs/server.key"
    client_ca_file: "/certs/ca.crt"
db:
  driver: "postgres"
  postgres: "postgres://easyp_svc:easyp_pass@easyp-postgres:5432/easyp_db?sslmode=disable"
registry:
  plugins_dir: "/plugins"
  max_output_size: 67108864
  # Bound on the unpacked plugins in plugins_dir. Archives are downloaded on
  # demand and nothing removes them on its own, so without a limit the
  # directory grows towards the size of every plugin ever requested. Least
  # recently used ones are dropped; the archive in S3 is left alone, so an
  # evicted plugin simply comes down again. 0 disables eviction.
  cache_max_bytes: 21474836480   # 20 GiB
  s3:
    endpoint: "http://rustfs:9000"
    bucket: "easyp-plugins"
    region: "us-east-1"
    access_key_id: "rustfsadmin"
    secret_access_key: "rustfsadmin"
    force_path_style: true
telemetry:
  otlp_endpoint: "easyp-alloy:4317"
  pyroscope_endpoint: "http://easyp-pyroscope:4040"
worker_pool:
  workers: 4                        # concurrent plugin lookups (DB, and downloads on a miss)
  queue_size: 16                    # waiting slots, for lookups and for generations alike
  max_concurrent_generations: 16    # concurrent plugin processes; beyond queue_size the answer is a refusal
  generation_timeout: 120s
  max_retries: 3
  shutdown_timeout: 30s
# Enterprise needs both a token and the public key it is verified against.
# Without them the service runs in community mode: no audit, at most 4 workers
# and 10 registered plugins. Empty fields fall back to the LICENSE_KEY and
# LICENSE_PUBLIC_KEY environment variables, which is how docker-compose passes
# them. Note that keeping the public key here makes the trust anchor editable:
# whoever can change this file decides which authority may issue licences.
license:
  key: ""         # inline PASETO token (takes priority over file)
  file: ""        # path to a file holding the token
  public_key: ""  # hex-encoded Ed25519 verification key
  cache_ttl: 5m   # how often the token is re-validated
rate_limit:
  requests_per_second: 10.0  # token refill rate (tokens/sec)
  burst: 20                   # max tokens (burst size)
  cleanup_interval: 10m       # stale client cleanup interval
  # Requests one client may have in flight at once. Rate alone does not bound
  # this: a caller staying under 10 rps can still hold every generation slot
  # with long requests. 0 disables the check.
  max_concurrent_per_ip: 2
# Audit is an Enterprise feature: without a license nothing is written,
# whatever these settings say. Defaults from env tags do NOT apply on the YAML
# path, so every field has to be spelled out here.
audit:
  buffer_size: 1000             # queue between the request path and the writer
  batch_size: 100               # rows per INSERT
  flush_interval: 1s            # forces a write of a partially filled batch
  max_save_retries: 3           # extra attempts before a batch is given up on
  retention_months: 12          # months of history to keep; 0 keeps everything
  pre_create_months: 3          # months of partitions created ahead of time
  partition_check_interval: 6h  # period between partition maintenance passes
  partition_op_timeout: 30s     # bounds a single maintenance pass
# Credentials for the mutating methods (CreatePlugin/UpdatePlugin/DeletePlugin).
# Reads stay anonymous. Only sha256 digests live here, never the tokens, so this
# section is safe to commit; the token itself belongs in your secret manager.
# Generate a pair with: easyp-svc auth new-token --name ci
# An empty list denies every write — a forgotten config must break registration
# rather than leave the registry open to the internet.
#
# The entry below is the digest of the literal string "local-dev-token" so the
# compose stack works out of the box. It is published in this repository and
# therefore worthless as a secret: REPLACE IT before this config goes anywhere
# a stranger can reach.
auth:
  write_tokens:
    - name: "local-dev"
      sha256: "0cd48eed49739dfdd99efaef37d251aae5a80866e5954763c6597943fff5ce9b"
