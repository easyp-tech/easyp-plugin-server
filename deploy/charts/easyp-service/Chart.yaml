apiVersion: v2
name: easyp-service
description: EasyP Service — a gRPC code generation service for Protobuf schemas
type: application

# version is the chart version and moves independently of the service.
#
# 0.2.0 moves the non-secret configuration out of hand-written environment
# variables in the Deployment and into a ConfigMap the service reads with --cfg,
# which is how every other deployment of it is configured. No values changed, so
# an upgrade that touches nothing else is behaviour-preserving — but anything
# that patched the Deployment's env block directly, or supplied a setting the
# chart had no `config.*` key for, has to move: use `config.*`, or `extraEnv`
# for a setting the chart does not model.
version: 0.2.0
# appVersion tracks the service release this chart was validated against and is
# the default image tag.
appVersion: "0.9.0"

home: https://github.com/easyp-tech/service
sources:
  - https://github.com/easyp-tech/service

keywords:
  - protobuf
  - grpc
  - codegen

maintainers:
  - name: easyp-tech
    url: https://github.com/easyp-tech

annotations:
  # The service itself is Elastic License 2.0; only sdk/ is Apache 2.0.
  licenses: Elastic-2.0
