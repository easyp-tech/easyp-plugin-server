{{- include "easyp-service.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "easyp-service.fullname" . }}
  labels:
    {{- include "easyp-service.labels" . | nindent 4 }}
  {{- if and .Values.reloader.enabled .Values.tls.enabled }}
  annotations:
    # The service loads its key pair once at startup, so a rotated certificate
    # needs a new pod. Without Reloader installed this annotation is inert and
    # rotation becomes `kubectl rollout restart`.
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if and .Values.persistence.enabled (ne .Values.persistence.accessMode "ReadWriteMany") }}
  # Recreate, because a ReadWriteOnce volume can be attached to one node at a
  # time. A rolling update starts the replacement pod before retiring the old
  # one, and if the scheduler picks a different node that pod waits on a
  # Multi-Attach error forever — the rollout never completes and never fails.
  # The choice is not between downtime and none; it is between a short gap and
  # a stuck upgrade. Give the pod a ReadWriteMany volume to roll instead.
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      {{- include "easyp-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "easyp-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The configuration is read once at startup, so a changed ConfigMap does
        # nothing until the pods are replaced. Kubernetes does not roll a
        # Deployment when a mounted ConfigMap changes; hashing it into the pod
        # template is what turns `helm upgrade --set config.…` into a rollout
        # rather than a silent no-op.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        # Same reasoning for the chart-managed secret: a rotated write token or
        # DSN otherwise waits for a restart nobody knows is needed. An
        # existingSecret cannot be hashed from here — rotating one takes
        # Reloader or `kubectl rollout restart`.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "easyp-service.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        # Matches the user baked into the image; the plugin cache volume is
        # chowned to it via fsGroup.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - service
            - start
            # The same file every other deployment of this service uses. What
            # used to be here instead was forty environment variables written out
            # by hand in this template — see configmap.yaml.
            - --cfg=/etc/easyp/config.yml
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only: the service unpacks plugin archives into
            # registry.pluginsDir at runtime. That path is a separate volume.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: metrics
              containerPort: {{ .Values.ports.metric }}
            - name: health
              containerPort: {{ .Values.ports.health }}
            {{- if .Values.mcp.enabled }}
            - name: mcp
              containerPort: {{ .Values.ports.mcp }}
            {{- end }}
          env:
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            # The secret's keys are the variable names; see the `secrets`
            # section of values.yaml for the exact set.
            - secretRef:
                name: {{ include "easyp-service.secretName" . }}
          # "/" checks the database, so it is readiness only. "/live" checks
          # nothing on purpose: pointing liveness at the database turns a brief
          # outage into a cluster-wide restart storm.
          startupProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/easyp
              readOnly: true
            - name: plugins
              mountPath: {{ .Values.config.registry.pluginsDir }}
            {{- if .Values.tls.enabled }}
            - name: server-tls
              mountPath: {{ .Values.tls.mountPath }}/server
              readOnly: true
            {{- if eq (include "easyp-service.mutualTLS" .) "true" }}
            - name: client-ca
              mountPath: {{ .Values.tls.mountPath }}/ca
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "easyp-service.fullname" . }}-config
        - name: plugins
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-plugins" (include "easyp-service.fullname" .)) }}
          {{- else }}
          # Ephemeral: every restart re-downloads plugin archives from S3.
          # sizeLimit is what keeps an overrun local to this pod — without it the
          # cache grows into the node's ephemeral storage, and the kubelet
          # resolves disk pressure by evicting pods that need not be this one.
          emptyDir:
            sizeLimit: {{ .Values.persistence.ephemeralSizeLimit }}
          {{- end }}
        {{- if .Values.tls.enabled }}
        - name: server-tls
          secret:
            secretName: {{ include "easyp-service.serverTLSSecret" . }}
        {{- if eq (include "easyp-service.mutualTLS" .) "true" }}
        - name: client-ca
          secret:
            secretName: {{ include "easyp-service.clientCASecret" . }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
