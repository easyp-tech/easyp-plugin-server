{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-plugins" (include "easyp-service.fullname" .) }}
  labels:
    {{- include "easyp-service.labels" . | nindent 4 }}
  annotations:
    # Deliberately kept when the release is removed: re-downloading the whole
    # plugin set costs far more than the disk does.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
