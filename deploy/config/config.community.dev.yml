server:
  host: "0.0.0.0"
  port:
    grpc: 8080
    metric: 8081
    health: 8082
    mcp: 8083
  force_shutdown_after: 150s
  trusted_proxies: []
  max_recv_msg_size: 67108864
  max_send_msg_size: 67108864
  max_concurrent_streams: 256
  tls:
    cert_file: "/certs/server.crt"
    key_file: "/certs/server.key"
    client_ca_file: "/certs/ca.crt"

db:
  driver: "postgres"
  postgres: "postgres://easyp_svc:easyp_pass@postgres:5432/easyp_community_db?sslmode=disable"

registry:
  plugins_dir: "/plugins"
  # Largest response a plugin may produce. Spelled out because the YAML path
  # never reaches envconfig, so the default on the field does not apply here
  # and an omitted value means zero — which refuses every generation.
  max_output_size: 67108864
  cache_max_bytes: 21474836480   # 20 GiB
  s3:
    endpoint: "https://storage.h3llo.cloud"
    bucket: "easyp-plugins"
    region: "us-east-1"
    force_path_style: true
    # access_key_id and secret_access_key are deliberately absent. They arrive as
    # REGISTRY_S3_ACCESS_KEY_ID and REGISTRY_S3_SECRET_ACCESS_KEY from
    # deploy/.env.dev, which is not committed. This file is, and a previous
    # version of it put a live key pair in a public repository.

# Both are empty unless the observability overlay is running: an endpoint
# naming a container that does not exist makes every export attempt fail and
# retry, which costs more than the telemetry is worth on a stack without it.
# docker-compose.observability.yml is what makes these reachable.
# Names the containers docker-compose.observability.yml brings up. This file is
# read as YAML and never reaches envconfig, so the values cannot be supplied
# from the environment — they are written out, and the stack either has those
# containers or it does not. Without the overlay the exporters retry a name that
# does not resolve: the service still serves, but its log fills with connection
# errors, so blank these two out when running the dev stack on its own.
telemetry:
  otlp_endpoint: "easyp-alloy:4317"
  pyroscope_endpoint: "http://easyp-pyroscope:4040"

worker_pool:
  workers: 4
  queue_size: 16
  max_concurrent_generations: 16
  generation_timeout: 120s
  max_retries: 3
  shutdown_timeout: 30s

license:
  key: ""
  file: ""
  public_keys: {}
  public_key: ""
  cache_ttl: 5m

rate_limit:
  requests_per_second: 10.0
  burst: 20
  cleanup_interval: 10m
  max_concurrent_per_ip: 2

audit:
  buffer_size: 1000
  batch_size: 100
  flush_interval: 1s
  max_save_retries: 3
  retention_months: 12
  pre_create_months: 3
  partition_check_interval: 6h
  partition_op_timeout: 30s

auth:
  write_tokens:
    - name: "local-dev"
      sha256: "0cd48eed49739dfdd99efaef37d251aae5a80866e5954763c6597943fff5ce9b"
