server:
  host: "0.0.0.0"
  port:
    grpc: 8080
    metric: 8081
    health: 8082
    mcp: 8083
  force_shutdown_after: 150s   # must exceed worker_pool.generation_timeout
  # Local mode runs without TLS on purpose: clients connect with --insecure.
  # To exercise mTLS locally, run `task certs` and fill these in.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""
db:
  driver: "postgres"
  postgres: "postgres://easyp_svc:easyp_pass@localhost:5433/easyp_db?sslmode=disable"
registry:
  plugins_dir: "./plugins"
  max_output_size: 67108864
  cache_max_bytes: 21474836480   # 20 GiB of unpacked plugins; 0 disables eviction
  # S3 binary storage is disabled by default in local mode (up-minimal starts
  # postgres only). To enable, start rustfs and uncomment:
  # s3:
  #   endpoint: "http://localhost:9000"
  #   bucket: "easyp-plugins"
  #   region: "us-east-1"
  #   access_key_id: "rustfsadmin"
  #   secret_access_key: "rustfsadmin"
  #   force_path_style: true
# Empty because `task up-minimal` starts postgres and nothing else: there is no
# collector on the host to receive any of this. An endpoint nobody answers on
# does not fail loudly — the exporters connect lazily and then retry forever,
# filling the log of a local run with connection errors.
#
# Bring up the observability stack and set these in the shell instead:
#   TELEMETRY_OTEL_EXPORTER_OTLP_ENDPOINT=localhost:4317 \
#   TELEMETRY_PYROSCOPE_ENDPOINT=http://localhost:4040 task run-local
telemetry:
  otlp_endpoint: ""
  pyroscope_endpoint: ""
worker_pool:
  workers: 4                        # concurrent plugin lookups (DB, and downloads on a miss)
  queue_size: 16                    # waiting slots, for lookups and for generations alike
  max_concurrent_generations: 16    # concurrent plugin processes; beyond queue_size the answer is a refusal
  generation_timeout: 120s
  max_retries: 3
  shutdown_timeout: 30s
license:
  key: ""
  file: ""
  public_keys: {}
  public_key: ""
  cache_ttl: 5m
rate_limit:
  requests_per_second: 10.0
  burst: 20
  cleanup_interval: 10m
  max_concurrent_per_ip: 2    # in-flight requests per client; 0 disables
audit:
  buffer_size: 1000
  batch_size: 100
  flush_interval: 1s
  max_save_retries: 3
  retention_months: 12
  pre_create_months: 3
  partition_check_interval: 6h
  partition_op_timeout: 30s
# Local mode ships a fixed, publicly known token so `task run-local` works out of
# the box. It is the digest of the literal string "local-dev-token" — never use
# this anywhere reachable from a network.
auth:
  write_tokens:
    - name: "local-dev"
      sha256: "0cd48eed49739dfdd99efaef37d251aae5a80866e5954763c6597943fff5ce9b"
