# Configuration for `task run-local`: the service on the host, postgres in a
# container, nothing else.
#
# This file states what differs from the defaults compiled into the binary, and
# nothing else — see the header of config.yml for why. To see everything it
# resolves to, defaults included:
#
#   easyp-svc config print --cfg deploy/config/config.local.yml --origin

server:
  port:
    grpc: 8080
    metric: 8081
    health: 8082
    mcp: 8083

# tls is absent, so local mode serves plaintext and clients connect with
# --insecure. To exercise mTLS locally, run `task certs` and set
# server.tls.cert_file, key_file and client_ca_file to the files it writes.

# trusted_proxies is absent, and correctly so: there is no proxy here, so the
# connecting address is the client's. It is set in every other config in this
# directory, where traefik is in front.

db:
  # Port 5433, not 5432: `task up-minimal` maps it there so a local postgres
  # already running on the default port is left alone.
  postgres: "postgres://easyp_svc:easyp_pass@localhost:5433/easyp_db?sslmode=disable"

registry:
  # Relative to the working directory, because this run has no container
  # filesystem to put /plugins on.
  plugins_dir: "./plugins"
  # S3 binary storage is disabled by default in local mode: `task up-minimal`
  # starts postgres only, so there is nothing to talk to. Plugins are then read
  # from plugins_dir alone and nothing is ever evicted from it. To enable, start
  # rustfs and uncomment:
  # s3:
  #   endpoint: "http://localhost:9000"
  #   bucket: "easyp-plugins"
  #   access_key_id: "rustfsadmin"
  #   secret_access_key: "rustfsadmin"
  #   force_path_style: true

# telemetry is absent because there is no collector on the host to receive it.
# The endpoints have no defaults precisely so that "none" can be said by saying
# nothing; an endpoint nobody answers on does not fail loudly, it retries
# forever and fills the log of a local run with connection errors.
#
# Bring up the observability stack and set them in the shell instead:
#   TELEMETRY_OTEL_EXPORTER_OTLP_ENDPOINT=localhost:4317 \
#   TELEMETRY_PYROSCOPE_ENDPOINT=http://localhost:4040 task run-local

# Local mode ships a fixed, publicly known token so `task run-local` works out of
# the box. It is the digest of the literal string "local-dev-token" — never use
# this anywhere reachable from a network.
auth:
  write_tokens:
    - name: "local-dev"
      sha256: "0cd48eed49739dfdd99efaef37d251aae5a80866e5954763c6597943fff5ce9b"
