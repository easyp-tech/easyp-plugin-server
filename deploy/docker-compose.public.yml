# Overlay that turns the dev stack into a publicly reachable one.
#
#   docker compose -f deploy/docker-compose.dev.yml -f deploy/docker-compose.public.yml \
#     --env-file deploy/.env.dev up -d
#   task up-dev-public
#
# It exists as an overlay rather than a flag because the difference is not a
# setting but a trust model. On a laptop the stack serves the throwaway CA from
# deploy/certs and answers to *.easyp.localhost. In front of the internet it has
# to serve a certificate the easyp CLI will accept without being told anything:
# the client verifies against the system trust store and presents no certificate
# of its own (see easyp/internal/adapters/plugin/remote.go). A dev CA cannot be
# made to work there, and pointing ACME at *.easyp.localhost cannot work here —
# so the two live apart instead of in one file with a switch.
#
# Requires, on the host this runs on:
#   - EASYP_DEV_DOMAIN and ACME_EMAIL set in deploy/.env.dev
#   - A and AAAA records for community.$EASYP_DEV_DOMAIN,
#     enterprise.$EASYP_DEV_DOMAIN and $EASYP_DEV_DOMAIN itself
#   - port 80 reachable from the internet: the HTTP-01 challenge is answered
#     there, and Let's Encrypt will not follow a redirect to a port it cannot see

services:
  traefik:
    environment:
      # The static configuration file carries no resolver, so an ACME account is
      # never created by a local run. Traefik reads these on top of it.
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL is required: Let's Encrypt sends expiry warnings there}"
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_STORAGE: "/acme/acme.json"
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_HTTPCHALLENGE_ENTRYPOINT: "web"
    volumes:
      # A named volume, not a bind: acme.json holds the account key and the
      # issued certificates, traefik refuses it unless it is mode 600, and a
      # bind mount hands it whatever the host directory has.
      - "acme:/acme"
    ports:
      # Overrides the loopback binding of the dev stack: both the challenge and
      # the clients arrive from outside.
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"

  service-community:
    labels:
      traefik.http.routers.easyp-community.tls.certresolver: "le"

  service-enterprise:
    labels:
      traefik.http.routers.easyp-enterprise.tls.certresolver: "le"

volumes:
  acme:
