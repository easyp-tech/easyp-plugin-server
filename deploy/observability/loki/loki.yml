auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /tmp/loki

schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  aws:
    endpoint: ${TELEMETRY_S3_ENDPOINT:-rustfs:9000}
    access_key_id: ${TELEMETRY_S3_ACCESS_KEY_ID:-rustfsadmin}
    secret_access_key: ${TELEMETRY_S3_SECRET_ACCESS_KEY:-rustfsadmin}
    s3forcepathstyle: true
    insecure: ${TELEMETRY_S3_INSECURE:-true}
    bucketnames: ${TELEMETRY_BUCKET_PREFIX:-}loki-chunks

  tsdb_shipper:
    active_index_directory: /tmp/loki/tsdb-index
    cache_location: /tmp/loki/tsdb-cache

limits_config:
  allow_structured_metadata: false
  # Logs are worth keeping only as long as someone might look back at them, and
  # the object store bills for the rest. Without this the store grows without
  # bound: nothing else in the pipeline ever deletes a chunk.
  retention_period: 168h

compactor:
  working_directory: /tmp/loki/compactor
  # The limit above is inert on its own — the compactor is what enforces it.
  retention_enabled: true
  delete_request_store: s3

ruler:
  storage:
    type: s3
    s3:
      endpoint: ${TELEMETRY_S3_ENDPOINT:-rustfs:9000}
      access_key_id: ${TELEMETRY_S3_ACCESS_KEY_ID:-rustfsadmin}
      secret_access_key: ${TELEMETRY_S3_SECRET_ACCESS_KEY:-rustfsadmin}
      s3forcepathstyle: true
      insecure: ${TELEMETRY_S3_INSECURE:-true}
      bucketnames: ${TELEMETRY_BUCKET_PREFIX:-}loki-ruler
