target: all
multitenancy_enabled: false

server:
  http_listen_port: 4040

storage:
  backend: s3
  s3:
    endpoint: ${OBS_S3_ENDPOINT:-rustfs:9000}
    access_key_id: ${OBS_S3_ACCESS_KEY_ID:-rustfsadmin}
    secret_access_key: ${OBS_S3_SECRET_ACCESS_KEY:-rustfsadmin}
    bucket_name: ${OBS_BUCKET_PREFIX:-}pyroscope
    insecure: ${OBS_S3_INSECURE:-true}

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

compactor:
  sharding_ring:
    kvstore:
      store: inmemory

store_gateway:
  sharding_ring:
    kvstore:
      store: inmemory
    replication_factor: 1

limits:
  # Profiles are the bulkiest of the four signals and the least useful once
  # cold. Without a retention the bucket only ever grows. It lives under limits
  # rather than compactor: the compactor acts on it, but does not define it.
  compactor_blocks_retention_period: 72h
