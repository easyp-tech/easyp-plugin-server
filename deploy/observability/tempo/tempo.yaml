server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true

storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      endpoint: ${TELEMETRY_S3_ENDPOINT:-rustfs:9000}
      bucket: ${TELEMETRY_BUCKET_PREFIX:-}tempo
      access_key: ${TELEMETRY_S3_ACCESS_KEY_ID:-rustfsadmin}
      secret_key: ${TELEMETRY_S3_SECRET_ACCESS_KEY:-rustfsadmin}
      insecure: ${TELEMETRY_S3_INSECURE:-true}
      forcepathstyle: true

compactor:
  compaction:
    # Traces age out faster than logs: they are large, and a week-old trace is
    # of interest to nobody. Absent this, blocks accumulate forever.
    block_retention: 72h

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
