entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  metrics:
    address: ":8082"

log:
  level: DEBUG
  format: json

api:
  dashboard: true
  insecure: true # Allows dashboard access without auth (for local dev)

accessLog:
  format: "json"

metrics:
  prometheus:
    entryPoint: metrics
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    headerLabels:
      useragent: User-Agent

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  # Holds the mTLS material for the service backend and the edge certificate:
  # neither can be expressed as a docker label.
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
